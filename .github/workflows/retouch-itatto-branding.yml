name: Retouch iTatto branding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retouch-itatto-branding.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retouch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iTatto
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply branding changes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const textExts = new Set(['.ts', '.tsx', '.js', '.jsx', '.json', '.md', '.css']);

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules' || entry.name === '.next') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else {
                const ext = path.extname(entry.name);
                if (!textExts.has(ext)) continue;
                let text = fs.readFileSync(full, 'utf8');
                const original = text;

                text = text
                  // Roles and vertical vocabulary.
                  .replace(/tatuador/g, 'artista')
                  .replace(/tatuadores/g, 'artistas')
                  .replace(/Tatuador/g, 'Artista')
                  .replace(/Tatuadores/g, 'Artistas')
                  .replace(/estudios de tatuajes/g, 'estudios')
                  .replace(/Estudios de tatuajes/g, 'Estudios')
                  .replace(/estudio de tatuajes/g, 'estudio')
                  .replace(/Estudio de tatuajes/g, 'Estudio')
                  .replace(/una estudio/g, 'un estudio')
                  .replace(/la estudio/g, 'el estudio')
                  .replace(/Las estudios/g, 'Los estudios')
                  .replace(/estudios activas/g, 'estudios activos')
                  .replace(/Estudios activas/g, 'Estudios activos')
                  .replace(/favorita/g, 'favorito')
                  .replace(/Regístrala/g, 'Regístralo')
                  .replace(/creada/g, 'creado')
                  .replace(/lista/g, 'listo')
                  // Main green palette to dark gray.
                  .replace(/hsl\(174,72%,28%\)/g, 'hsl(220,9%,18%)')
                  .replace(/hsl\(174,60%,38%\)/g, 'hsl(220,8%,28%)')
                  .replace(/hsl\(174,72%,30%\)/g, 'hsl(220,9%,20%)')
                  .replace(/hsl\(174,60%,40%\)/g, 'hsl(220,8%,30%)')
                  .replace(/hsl\(174,72%,10%\)/g, 'hsl(220,12%,8%)')
                  .replace(/hsl\(174,65%,16%\)/g, 'hsl(220,10%,14%)')
                  .replace(/hsl\(174,72%,50%\)/g, 'hsl(220,8%,46%)')
                  .replace(/hsl\(174, 72%, 50%\)/g, 'hsl(220, 8%, 46%)')
                  .replace(/hsl\(174,72%,34%\)/g, 'hsl(220,9%,22%)')
                  .replace(/hsl\(174,72%,24%\)/g, 'hsl(220,9%,16%)')
                  .replace(/hsl\(174,55%,42%\)/g, 'hsl(220,8%,32%)')
                  .replace(/hsl\(174,60%,36%\)/g, 'hsl(220,8%,26%)')
                  .replace(/hsl\(174,58%,20%\)/g, 'hsl(220,10%,16%)')
                  .replace(/hsl\(174,30%,97%\)/g, 'hsl(220,12%,97%)')
                  .replace(/hsl\(174,30%,93%\)/g, 'hsl(220,12%,92%)')
                  .replace(/hsl\(174,72%,96%\)/g, 'hsl(220,12%,94%)')
                  .replace(/hsl\(174,20%,97%\)/g, 'hsl(220,12%,97%)');

                // Tailwind CSS variables.
                if (full.endsWith(path.join('src', 'app', 'globals.css'))) {
                  text = text
                    .replace('--primary: 174 72% 34%;', '--primary: 220 9% 20%;')
                    .replace('--ring: 174 72% 34%;', '--ring: 220 9% 20%;')
                    .replace('--primary: 174 72% 40%;', '--primary: 220 8% 72%;')
                    .replace('--ring: 174 72% 40%;', '--ring: 220 8% 72%;');
                }

                // Landing logo/icon and copy polish.
                if (full.endsWith(path.join('src', 'app', 'page.tsx'))) {
                  text = text
                    .replace(/Scissors,/g, 'PenTool,')
                    .replace(/<Scissors className=/g, '<PenTool className=')
                    .replace(/import \{([\s\S]*?)\} from "lucide-react";/, (match) => match.replace('PenTool,', 'PenTool,'))
                    .replace(/Descubre estudios activos/g, 'Descubre estudios de tatuaje')
                    .replace(/Tu estudio<br \/>/g, 'Tu estudio<br />')
                    .replace(/Encuentra estudios por país y ciudad, elige tu artista/g, 'Encuentra estudios por país y ciudad, elige tu artista')
                    .replace(/Estudios disponibles/g, 'Estudios disponibles')
                    .replace(/No hay estudios activos aquí/g, 'No hay estudios activos aquí')
                    .replace(/¿Tienes un estudio\? Regístralo gratis →/g, '¿Tienes un estudio? Regístralo gratis →')
                    .replace(/El 100% del pago va directo a el estudio/g, 'El 100% del pago va directo al estudio')
                    .replace(/Los estudios gestionan/g, 'Los estudios gestionan')
                    .replace(/Tatuaje clásico/g, 'Tatuaje pequeño')
                    .replace(/B\n                    <\/div>/, 'I\n                    </div>');
                }

                // Onboarding copy polish.
                if (full.endsWith(path.join('src', 'app', '(dashboard)', 'onboarding', 'steps', 'step-barber.tsx'))) {
                  text = text
                    .replace(/barberName/g, 'artistName')
                    .replace(/barberBio/g, 'artistBio')
                    .replace(/display_name: formData\.artistName/g, 'display_name: formData.artistName')
                    .replace(/bio: formData\.artistBio/g, 'bio: formData.artistBio')
                    .replace(/Tu nombre como artista \*/g, 'Tu nombre como artista *')
                    .replace(/id="barberName"/g, 'id="artistName"')
                    .replace(/htmlFor="barberName"/g, 'htmlFor="artistName"')
                    .replace(/id="barberBio"/g, 'id="artistBio"')
                    .replace(/htmlFor="barberBio"/g, 'htmlFor="artistBio"')
                    .replace(/¡Estudio creado! \(demo\)/g, '¡Estudio creado! (demo)')
                    .replace(/Error al crear el estudio/g, 'Error al crear el estudio');
                }

                if (text !== original) fs.writeFileSync(full, text);
              }
            }
          }

          walk(root);
          fs.rmSync(path.join(root, '.github/workflows/retouch-itatto-branding.yml'), { force: true });
          NODE

      - name: Commit branding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retouch iTatto branding" || exit 0
          git push
